name: real_estate_app
description: تطبيق إدارة العقارات والإيجارات للأندرويد
publish_to: 'none'
version: 2.2.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.8.3
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  pdf: ^3.10.8
  printing: ^5.12.0
  intl: any
  crypto: ^3.0.3
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.0.0
  workmanager: any
  google_sign_in: ^6.2.2
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  googleapis: ^13.2.0
  archive: ^3.6.1
  file_picker: ^8.2.0
  share_plus: ^10.1.4
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
