name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project exists
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example --project-name real_estate_app .
          fi

      - name: Patch Android
        run: python3 tool/patch_android.py

      - name: Get Flutter packages
        run: flutter pub get

      - name: Clean Flutter
        run: flutter clean

      - name: Get Flutter packages again
        run: flutter pub get

      - name: Clean Gradle
        run: |
          cd android
          ./gradlew clean
          cd ..

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-apk
          path: build/app/outputs/flutter-apk/app-release.apk
